    parameters:
      - $ref: '#/components/parameters/X-Mantis-Username'
    delete:
      summary: Delete an issue note
      operationId: IssueNotesDelete
      description: ''
      tags:
        - 'Issue Notes'
      parameters:
        - $ref: '#/components/parameters/issue_id'
        - name: note_id
          in: path
          schema:
            type: integer
          description: ''
          required: true
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  '/api/rest/issues/{id}/relationships':
    parameters:
      - $ref: '#/components/parameters/X-Mantis-Username'
    post:
      summary: Add an issue relationship
      operationId: IssueRelationshipsAdd
      description: ''
      tags:
        - 'Issue Relationships'
      parameters:
        - $ref: '#/components/parameters/issue_id'
      requestBody:
        $ref: '#/components/requestBodies/IssueRelationshipsAdd'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  '/api/rest/issues/{id}/tags':
    parameters:
      - $ref: '#/components/parameters/X-Mantis-Username'
    post:
      summary: Attach a tag to issue
      operationId: IssueTagsAdd
      description: ''
      tags:
        - 'Issue Tags'
      parameters:
        - $ref: '#/components/parameters/issue_id'
      requestBody:
        $ref: '#/components/requestBodies/IssueTagsAdd'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  '/api/rest/issues/{id}/relationships/{relationship_id}':
    parameters:
      - $ref: '#/components/parameters/X-Mantis-Username'
    delete:
      summary: Delete an issue relationship
      operationId: IssueRelationshipsDelete
      description: ''
      tags:
        - 'Issue Relationships'
      parameters:
        - $ref: '#/components/parameters/issue_id'
        - name: relationship_id
          in: path
          schema:
            type: integer
          description: ''
          required: true
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  '/api/rest/issues/{id}/tags/{tag_id}':
    parameters:
      - $ref: '#/components/parameters/X-Mantis-Username'
    delete:
      summary: Detach a tag from an issue
      operationId: IssueTagsDelete
      description: ''
      tags:
        - 'Issue Tags'
      parameters:
        - $ref: '#/components/parameters/issue_id'
        - name: tag_id
          in: path
          schema:
            type: integer
          description: ''
          required: true
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  '/api/rest/issues':
    parameters:
      - $ref: '#/components/parameters/X-Mantis-Username'
    get:
      summary: Get issues
      operationId: IssueGetAll
      description: |-
        Returns issues visible to the effective user. Use `project_id` to scope the search and
        `filter_id` for a built-in or saved filter. Results are paginated; omit `select` to use
        the default issue fields.
      tags:
        - 'Issues'
      parameters:
        - name: project_id
          in: query
          schema:
            type: integer
            minimum: 0
          description: ''
          required: false
          example: 1
        - $ref: '#/components/parameters/issues_filter_id'
        - name: page_size
          in: query
          schema:
            type: integer
          description: ''
          required: false
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
          description: ''
          required: false
          example: 1
        - name: select
          in: query
          schema:
            type: string
          description: ''
          required: false
          example: id,summary,description
        - $ref: '#/components/parameters/If-None-Match'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      summary: Create an issue
      operationId: IssueAdd
      description: |
        When creating an issue, most of the fields other than `summary`, `description` and `category` are typically optional.
        It is also worth noting that when passing references to enumerations like `priority` or object references like `handler`,
        it is sufficient to pass the `id` or `name`.
      tags:
        - 'Issues'
      requestBody:
        $ref: '#/components/requestBodies/IssueAdd'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '202':
          $ref: '#/components/responses/Accepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      summary: Delete issues
      operationId: IssueDeleteAll
      description: Deletes the issues selected by the request's issue parameters.
      tags:
        - 'Issues'
      parameters:
        - name: id
          in: query
          schema:
            type: integer
            minimum: 1
          description: ID of the issue to delete.
          required: true
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  '/api/rest/issues/{id}':
    parameters:
      - $ref: '#/components/parameters/X-Mantis-Username'
    get:
      summary: Get an issue
      operationId: IssueGet
      description: |-
        Returns one visible issue. The response includes an `ETag`; use it with `If-Match` when
        subsequently updating or deleting the issue.
      tags:
        - 'Issues'
      parameters:
        - $ref: '#/components/parameters/issue_id'
        - name: select
          in: query
          schema:
            type: string
          description: ''
          required: false
          example: id,summary,description
        - $ref: '#/components/parameters/If-None-Match'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      summary: Update an issue
      operationId: IssueUpdate
      description: |-
        Applies the supplied fields to an existing issue. For optimistic concurrency, first read
        the issue and send its `ETag` in `If-Match`. A mismatch returns `412 Precondition Failed`.
      tags:
        - 'Issues'
      parameters:
        - $ref: '#/components/parameters/issue_id'
        - $ref: '#/components/parameters/If-Match'
      requestBody:
        $ref: '#/components/requestBodies/IssueUpdate'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      summary: Delete an issue
      operationId: IssueDelete
      description: |-
        Deletes an issue. Supply the current `ETag` in `If-Match` to ensure that the issue was
        not changed after it was read.
      tags:
        - 'Issues'
      parameters:
        - $ref: '#/components/parameters/issue_id'
        - $ref: '#/components/parameters/If-Match'
      responses:
        '204':
          $ref: '#/components/responses/NoContentWithETag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
