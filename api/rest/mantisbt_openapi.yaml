    parameters:
      - $ref: '#/components/parameters/X-Mantis-Username'
    get:
      summary: Get My User Info
      operationId: UserGetMe
      description: ''
      tags:
        - 'Users'
      parameters:
        - name: select
          in: query
          schema:
            type: string
          description: Comma-separated list of user fields to return.
          required: false
          example: id,name,real_name,email,access_level
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  '/api/rest/issues/{id}/files':
    parameters:
      - $ref: '#/components/parameters/X-Mantis-Username'
    post:
      summary: Add attachments to issue
      operationId: IssueFilesAdd
      description: ''
      tags:
        - 'Issue Attachments'
      parameters:
        - $ref: '#/components/parameters/issue_id'
      requestBody:
        $ref: '#/components/requestBodies/IssueFilesAdd'
      responses:
        '201':
          $ref: '#/components/responses/CreatedNoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      summary: Get issue files
      operationId: IssueFilesGet
      description: ''
      tags:
        - 'Issue Attachments'
      parameters:
        - $ref: '#/components/parameters/issue_id'
      responses:
        '200':
          description: Issue files returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileCollection'
          headers:
            X-Mantis-Username:
              $ref: '#/components/headers/X-Mantis-Username'
            X-Mantis-LoginMethod:
              $ref: '#/components/headers/X-Mantis-LoginMethod'
            X-Mantis-Version:
              $ref: '#/components/headers/X-Mantis-Version'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
