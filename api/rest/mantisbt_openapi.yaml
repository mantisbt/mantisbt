paths:
  '/api/rest/filters/{id}':
    parameters:
      - $ref: '#/components/parameters/X-Mantis-Username'
    get:
      summary: Get a filter
      operationId: FilterGet
      description: ''
      tags:
        - 'Filters'
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
        - $ref: '#/components/parameters/filter_id'
    delete:
      summary: Delete a filter
      operationId: FilterDelete
      description: ''
      tags:
        - 'Filters'
      parameters:
        - $ref: '#/components/parameters/filter_id'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  '/api/rest/filters':
    parameters:
      - $ref: '#/components/parameters/X-Mantis-Username'
    get:
      summary: Get all filters
      operationId: FilterGetAll
      description: ''
      tags:
        - 'Filters'
      parameters:
        - name: project_id
          in: query
          schema:
            type: integer
          description: Return filters available in the specified project.
          required: false
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  '/api/rest/config':
    parameters:
      - $ref: '#/components/parameters/X-Mantis-Username'
    get:
      summary: Get Configuration Option
      operationId: ConfigGet
      description: ''
      tags:
        - 'Configs'
      parameters:
        - name: option[]
          in: query
          schema:
            type: string
          description: ''
          required: true
        - name: project_id
          in: query
          schema:
            type: integer
          description: ''
          required: false
        - name: user_id
          in: query
          schema:
            type: integer
          description: ''
          required: false
      responses:
        '200':
          $ref: '#/components/responses/Success'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      summary: Set Configs
      operationId: ConfigSet
      description: ''
      tags:
        - 'Configs'
      requestBody:
        $ref: '#/components/requestBodies/ConfigSet'
      responses:
        '200':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
