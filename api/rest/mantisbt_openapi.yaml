servers:
  - url: https://mantisbt.org/bugs
    description: MantisBT Official Bugtracker
  - url: '{protocol}://{hostname}:{port}/{basePath}'
    description: Your MantisBT instance
    variables:
      protocol:
        enum:
          - http
          - https
        default: https
      hostname:
        description: The server where MantisBT is installed, including port number if not standard.
        default: localhost
      port:
        default: ''
      basePath:
        description: The path where MantisBT is installed, without trailing `/`
        default: mantisbt
security:
  - api_key: []
components:
  securitySchemes:
    api_key:
      type: http
      scheme: bearer
      description: |-
        The user's API token, sent with the RFC 6750 bearer scheme (`Bearer <token>`).
        The bare form (`<token>`) is also accepted for backwards compatibility.
  headers:
    ETag:
      description: Entity tag for the response representation, when conditional requests are supported.
      schema:
        type: string
    WWW-Authenticate:
      description: Authentication challenge indicating that a bearer API token is accepted.
      schema:
        type: string
        example: Bearer
    X-Mantis-Username:
      description: |-
        The username under which the request was executed.
        When impersonation is active, this reflects the impersonated user's username.
      schema:
        type: string
    X-Mantis-LoginMethod:
      description: |-
        The authentication method used for the request.
        Possible values: `api-token`, `cookie`, `anonymous`.
      schema:
        type: string
        enum:
          - api-token
          - cookie
          - anonymous
    X-Mantis-Version:
      description: Version of the MantisBT instance that processed the request.
      schema:
        type: string
  schemas:
    ObjectRef:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Some Name
    ProjectRef:
      allOf:
        - $ref: '#/components/schemas/ObjectRef'
      properties:
        name:
          type: string
          example: MantisBT
    CategoryRef:
      allOf:
