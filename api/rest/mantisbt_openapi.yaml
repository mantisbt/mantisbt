  parameters:
    If-Match:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
      description: ETag returned by a prior issue read. The operation fails with 412 if it no longer matches.
    If-None-Match:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
      description: ETag returned by a prior issue read. A matching value returns 304 without a response body.
    X-Mantis-Username:
      name: X-Mantis-Username
      in: header
      required: false
      schema:
        type: string
      description: Username to impersonate for this request. Requires an authorized API token.
    issue_id:
      name: id
      in: path
      schema:
        type: integer
        minimum: 1
      description: 'The issue ID'
      required: true
      example: 123
    user_id:
      name: user_id
      in: path
      schema:
        type: integer
        minimum: 1
      description: 'The user ID'
      example: 5
      required: true
    project_id:
      name: project_id
      in: path
      schema:
        type: integer
        minimum: 0
      description: 'The project ID'
      required: true
      example: 1
    filter_id:
      name: id
      in: path
      schema:
        type: string
        description: |
          Following are the built-in filter names:  

          `assigned` - issues assigned to me.  
          `reported` - issues reported by me.  
          `monitored` - issues monitored by me.  
          `unassigned` - unassigned issues.  

          It is possible to also pass in an integer
          which is the id of a saved filter.
      required: true
    issues_filter_id:
      name: filter_id
      in: query
      schema:
        type: string
        description: |
          A built-in filter name or the ID of a saved filter.
      required: false
